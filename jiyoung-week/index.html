<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="cache-control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공쥬님 이번 주 일정 🗓️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF6FA; --ink:#3B2B38; --muted:#8B7788; --line:#EEDFE9; --card:#FFFFFF;
  --pink:#F06292; --lav:#B98FD6; --gold:#E8B84B;
  --sch:#E25A44; --care:#5A6B7C; --task:#D99B22; --deal:#2FA36B; --us:#F06292; --ex:#8B6BB1;
  --gap:#B9A9C4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#241A22; --ink:#F5E7F0; --muted:#C2A8B8; --line:#412F3C; --card:#312330;
    --pink:#F48FB1; --lav:#A67CC6;
    --sch:#F07A62; --care:#8DA2B5; --task:#E8B84B; --deal:#4FC08D; --us:#F48FB1; --ex:#A98FD0;
    --gap:#6C5C78;
  }
}
:root[data-theme="dark"]{
  --paper:#241A22; --ink:#F5E7F0; --muted:#C2A8B8; --line:#412F3C; --card:#312330;
  --pink:#F48FB1; --lav:#A67CC6;
  --sch:#F07A62; --care:#8DA2B5; --task:#E8B84B; --deal:#4FC08D; --us:#F48FB1; --ex:#A98FD0;
  --gap:#6C5C78;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;font-size:16px;line-height:1.7}
.wrap{max-width:600px;margin:0 auto;padding:0 18px 54px}

.hero{background:linear-gradient(160deg,#C86B9E,#A77BD0);color:#fff;
  padding:34px 20px 28px;text-align:center}
.hero .kick{font-size:11px;letter-spacing:5px;opacity:.85}
.hero h1{font-family:"Gowun Dodum",sans-serif;font-size:29px;margin:7px 0 4px;line-height:1.3}
.hero .sub{font-size:13px;opacity:.95}

/* 지금 배너 */
.now{margin:-18px auto 0;max-width:600px;position:relative;z-index:2;padding:0 18px}
.nowbox{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:15px 17px;box-shadow:0 6px 20px rgba(120,80,110,.12)}
.nowtop{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.nowlab{font-size:11px;letter-spacing:3px;color:var(--muted)}
.nowclock{font-family:"Gowun Dodum",sans-serif;font-size:14px;color:var(--muted)}
#nowtxt{font-family:"Gowun Dodum",sans-serif;font-size:19px;line-height:1.45;margin:0}
#nowsub{font-size:12.5px;color:var(--muted);margin:4px 0 0;line-height:1.55}

h2{font-family:"Gowun Dodum",sans-serif;font-size:20px;margin:30px 0 8px;
  display:flex;align-items:center;gap:8px}
.hint{font-size:12.5px;color:var(--muted);margin:-4px 0 14px}

/* 하루 카드 */
.day{background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:16px 16px 12px;margin-bottom:14px;overflow:hidden}
.day.istoday{border-color:var(--pink);box-shadow:0 0 0 2px rgba(240,98,146,.15)}
.dhead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  padding-bottom:11px;border-bottom:1px solid var(--line);margin-bottom:12px}
.dhead .dt{font-family:"Gowun Dodum",sans-serif;font-size:19px}
.dhead .wk{font-size:13px;color:var(--muted)}
.dhead .bdg{font-size:10.5px;padding:3px 9px;border-radius:999px;
  background:var(--pink);color:#fff;margin-left:auto;white-space:nowrap}
.dhead .cnt{font-size:11.5px;color:var(--muted);margin-left:auto}
.day.istoday .cnt{margin-left:0}

/* 타임라인 */
.row{display:grid;grid-template-columns:58px 1fr;gap:10px;position:relative}
.tm{font-size:11.5px;color:var(--muted);text-align:right;padding-top:3px;line-height:1.35;
  font-variant-numeric:tabular-nums}
.tm b{display:block;font-size:12.5px;color:var(--ink);font-weight:700}
.bd{position:relative;padding:0 0 13px 15px;border-left:2px solid var(--line)}
.row:last-child .bd{border-left-color:transparent;padding-bottom:2px}
.bd::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;
  border-radius:50%;background:var(--muted);border:2px solid var(--card)}
.ttl{font-family:"Gowun Dodum",sans-serif;font-size:16.5px;line-height:1.4}
.kind{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:999px;
  color:#fff;margin-left:6px;vertical-align:2px}
.dur{font-size:11.5px;color:var(--muted);margin-top:1px}

.k-sch::before{background:var(--sch)} .k-sch .kind{background:var(--sch)}
.k-care::before{background:var(--care)} .k-care .kind{background:var(--care)}
.k-task::before{background:var(--task)} .k-task .kind{background:var(--task);color:#4A3608}
.k-deal::before{background:var(--deal)} .k-deal .kind{background:var(--deal)}
.k-us::before{background:var(--us)} .k-us .kind{background:var(--us)}
.k-ex::before{background:var(--ex)} .k-ex .kind{background:var(--ex)}

/* 비는 시간 */
.row.free .bd{border-left-style:dashed;border-left-color:var(--gap)}
.row.free .bd::before{background:transparent;border:2px dashed var(--gap);width:9px;height:9px}
.row.free .ttl{font-size:13.5px;color:var(--gap);font-family:"Noto Sans KR",sans-serif}
.row.free .tm{opacity:.75}
.row.free .ttl b{color:var(--gap)}

/* 현재 진행 중 강조 */
.row.live .bd{background:linear-gradient(90deg,rgba(240,98,146,.11),transparent 70%);
  border-radius:0 12px 12px 0}
.row.live .ttl::after{content:" ● 지금";font-size:11px;color:var(--pink);font-weight:700}

.endrow{font-size:12.5px;color:var(--muted);padding:2px 0 4px 73px}

.note{background:var(--card);border:2px dashed var(--line);border-radius:16px;
  padding:13px 15px;font-size:13.5px;margin:22px 0 0;line-height:1.7}
.note b{color:var(--pink)}
.lg{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 16px}
.lg span{font-size:11px;padding:3px 10px;border-radius:999px;color:#fff}
.lg .s{background:var(--sch)} .lg .c{background:var(--care)}
.lg .t{background:var(--task);color:#4A3608} .lg .d{background:var(--deal)}
.lg .u{background:var(--us)} .lg .e{background:var(--ex)}

.back{display:inline-block;margin-top:24px;font-size:13.5px;color:var(--pink);
  text-decoration:none;font-family:"Gowun Dodum",sans-serif}
.foot{text-align:center;color:var(--muted);font-size:13.5px;
  font-family:"Gowun Dodum",sans-serif;padding-top:18px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>

<header class="hero">
  <div class="kick">JIYOUNG · THIS WEEK</div>
  <h1>공쥬님 이번 주 일정</h1>
  <div class="sub">10월 6일 (화) ~ 10월 9일 (금)</div>
</header>

<div class="now">
  <div class="nowbox">
    <div class="nowtop">
      <span class="nowlab">지금</span>
      <span class="nowclock" id="clock">--:--</span>
    </div>
    <p id="nowtxt">불러오는 중…</p>
    <p id="nowsub"></p>
  </div>
</div>

<div class="wrap">

  <h2>🗓️ 하루씩 보기</h2>
  <p class="hint">점선으로 된 칸이 <b>비는 시간</b>이에요 · 연락하기 좋은 때</p>

  <div class="lg">
    <span class="s">수업·실습</span><span class="c">관리·병원</span>
    <span class="t">과제</span><span class="d">계약</span>
    <span class="e">운동</span><span class="u">우리</span>
  </div>

  <div id="days"></div>

  <div class="note">
    공쥬님 캘린더를 <b>그대로 옮겨 적은 것</b>이에요. 제가 임의로 바꾼 건 없습니다.<br>
    일정이 바뀌면 말씀만 해주세요 — 바로 고쳐둘게요 🙂
  </div>

  <a class="back" href="../">← 데이트 앨범으로 돌아가기</a>
  <p class="foot">공쥬님 하루를 기억하고 싶어서요 💗</p>
</div>

<script>
(function(){
  var YEAR=2026, MON=10;
  var DAYS=[
    {d:6, w:'화', items:[
      ['07:00','07:30','헤어만+얼리1','sch','수업'],
      ['09:00','10:30','면접 여1','sch','수업'],
      ['10:30','12:00','데일리 여1','sch','수업'],
      ['13:00','15:00','에스테틱 (얼굴경락·팔 고주파·하체)','care','관리'],
      ['15:00','15:30','화이트태닝','care','관리'],
      ['16:00','17:00','과제제출','task','과제'],
      ['17:00','18:00','병원','care','관리'],
      ['20:00','21:10','발레','ex','운동']
    ]},
    {d:7, w:'수', items:[
      ['08:15','09:00','헤어만+피부만3','sch','수업'],
      ['09:30','11:00','촬영 여1','sch','수업'],
      ['13:30','14:00','화이트태닝','care','관리'],
      ['14:30','15:30','피부과','care','관리'],
      ['19:30','20:20','스텝박스','ex','운동'],
      ['20:30','21:20','바레','ex','운동']
    ]},
    {d:8, w:'목', items:[
      ['09:30','11:00','연주 여1','sch','수업'],
      ['14:00','15:00','권리계약서','deal','계약'],
      ['15:00','16:00','임대차계약서','deal','계약'],
      ['18:00','20:00','오빠랑 저녁 🤍','us','우리']
    ]},
    {d:9, w:'금', items:[
      ['12:00','13:30','재이님 (13/10)','sch','수업']
    ]}
  ];

  function mins(s){ var p=s.split(':'); return (+p[0])*60 + (+p[1]); }
  function hm(t){ var h=Math.floor(t/60), m=t%60;
    return (h<10?'0':'')+h+':'+(m<10?'0':'')+m; }
  function span(a,b){ var n=b-a, h=Math.floor(n/60), m=n%60;
    return (h?h+'시간':'')+(m?(h?' ':'')+m+'분':''); }

  /* ---------- 하루 카드 렌더 ---------- */
  var today=new Date();
  var isThisMonth = (today.getFullYear()===YEAR && today.getMonth()+1===MON);
  var td = isThisMonth ? today.getDate() : -1;
  var out='';

  DAYS.forEach(function(day){
    var on = (day.d===td);
    out += '<div class="day'+(on?' istoday':'')+'" id="d'+day.d+'">';
    out += '<div class="dhead"><span class="dt">10월 '+day.d+'일</span>'
         + '<span class="wk">('+day.w+'요일)</span>'
         + (on?'<span class="bdg">오늘</span>':'')
         + '<span class="cnt">일정 '+day.items.length+'개</span></div>';

    var prevEnd=null;
    day.items.forEach(function(it){
      var s=mins(it[0]), e=mins(it[1]);
      if(prevEnd!==null && s-prevEnd>=30){
        out += '<div class="row free"><div class="tm">'+hm(prevEnd)+'<b>&nbsp;</b></div>'
             + '<div class="bd"><div class="ttl">비는 시간 · <b>'+span(prevEnd,s)+'</b></div></div></div>';
      }
      out += '<div class="row k-'+it[3]+'" data-s="'+s+'" data-e="'+e+'" data-d="'+day.d+'">'
           + '<div class="tm"><b>'+it[0]+'</b>'+it[1]+'</div>'
           + '<div class="bd"><div class="ttl">'+it[2]+'<span class="kind">'+it[4]+'</span></div>'
           + '<div class="dur">'+span(s,e)+'</div></div></div>';
      prevEnd=e;
    });
    out += '<div class="endrow">'+hm(prevEnd)+' 이후는 비어 있어요</div>';
    out += '</div>';
  });
  document.getElementById('days').innerHTML=out;

  /* ---------- 지금 배너 ---------- */
  function paint(){
    var n=new Date();
    document.getElementById('clock').textContent =
      (n.getHours()<10?'0':'')+n.getHours()+':'+(n.getMinutes()<10?'0':'')+n.getMinutes();

    var txt=document.getElementById('nowtxt'), sub=document.getElementById('nowsub');
    var nd = (n.getFullYear()===YEAR && n.getMonth()+1===MON) ? n.getDate() : -1;
    var cur=n.getHours()*60+n.getMinutes();

    document.querySelectorAll('.row.live').forEach(function(el){el.classList.remove('live');});

    var day=null;
    DAYS.forEach(function(x){ if(x.d===nd) day=x; });

    if(!day){
      var fut=null;
      DAYS.forEach(function(x){ if(fut===null && x.d>nd) fut=x; });
      if(nd<0 || fut===null){
        txt.textContent='이번 주 일정표예요';
        sub.textContent='10월 6일(화)부터 9일(금)까지 적어뒀습니다.';
      }else{
        txt.textContent=fut.w+'요일부터 시작이에요';
        sub.textContent='10월 '+fut.d+'일 '+fut.items[0][0]+' · '+fut.items[0][2];
      }
      return;
    }

    var live=null, next=null;
    day.items.forEach(function(it){
      var s=mins(it[0]), e=mins(it[1]);
      if(cur>=s && cur<e) live=it;
      if(next===null && cur<s) next=it;
    });

    if(live){
      txt.innerHTML='공쥬님 <b>'+live[2]+'</b> 중이에요';
      var left=mins(live[1])-cur;
      sub.textContent='끝나는 시각 '+live[1]+' · '+left+'분 남았어요'
        + (next ? ' · 다음은 '+next[0]+' '+next[2] : ' · 이게 오늘 마지막 일정이에요');
      var sel=document.querySelector('.row[data-d="'+day.d+'"][data-s="'+mins(live[0])+'"]');
      if(sel) sel.classList.add('live');
    }else if(next){
      var till=mins(next[0])-cur;
      var hh=Math.floor(till/60), mm=till%60;
      txt.innerHTML='지금은 <b>비어 있어요</b>';
      sub.textContent='다음 일정 '+next[0]+' '+next[2]+'까지 '
        + (hh?hh+'시간 ':'')+(mm?mm+'분':'')+' 남았어요';
    }else{
      var fin=day.items[day.items.length-1];
      txt.innerHTML='오늘 일정은 <b>다 끝났어요</b>';
      sub.textContent='마지막이 '+fin[1]+' '+fin[2]+'였습니다.';
    }
  }
  paint();
  setInterval(paint, 30000);
})();
</script>
</body>
</html>
